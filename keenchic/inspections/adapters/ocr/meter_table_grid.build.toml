inspection_name = "ocr/meter-table-grid"

[adapter]
source = "keenchic/inspections/adapters/ocr/meter_table_grid.py"
cython = true
dependencies = [
    "keenchic/inspections/adapters/ocr/meter_table.py",
]

[[submodule]]
dir = "keenchic/inspections/ocr/temper_num_st"
bare = [
    { name = "model_detect_openvino_512", src = "model_detect_openvino_512.py" },
    { name = "model_detect_trt_512",      src = "model_detect_trt_512.py"      },
    { name = "procd_table",                src = "procd_table.py"                },
    { name = "procd_table_L",             src = "procd_table_L.py"              },
    { name = "utils",                     src = "utils.py"                     },
]
weights_subdir = "weights"
engine = [
    { profile = "taimide-jetson", name = "head", pattern = "smp_Unet++_head_table_512-*.trt" },
    { profile = "taimide-jetson", name = "yolo", pattern = "yolo12_512_temper-*.trt" },
]
